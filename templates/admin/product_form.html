{% extends 'base.html' %}
{% block title %}{{ title }} | {{ site_name }}{% endblock %}
{% block content %}<section class="admin-wrap"><div class="container py-4"><div class="d-flex justify-content-between align-items-end gap-3"><div><div class="eyebrow dark">CATALOG</div><h1>{{ title }}</h1></div><a class="btn btn-outline-dark rounded-pill" href="{{ url_for('admin_products') }}">← Quay lại</a></div><form method="post" enctype="multipart/form-data" class="form-panel mt-4"><div class="row g-3"><div class="col-md-4"><label>SKU *</label><input class="form-control" name="sku" required value="{{ product.sku if product else '' }}"></div><div class="col-md-8"><label>Tên sản phẩm *</label><input class="form-control" name="name" required value="{{ product.name if product else '' }}"></div><div class="col-md-6"><label>Nhóm sản phẩm</label><input class="form-control" name="category" value="{{ product.category if product else 'Quạt ly tâm' }}"></div><div class="col-md-6"><label>URL ảnh</label><input class="form-control" name="image_url" value="{{ product.image_url if product else '' }}"></div><div class="col-md-6"><label>Hoặc tải ảnh</label><input class="form-control" type="file" name="image_file" accept="image/*"></div><div class="col-md-6"><label>Mô tả ngắn</label><input class="form-control" name="short_description" value="{{ product.short_description if product else '' }}"></div><div class="col-md-4"><label>Lưu lượng</label><input class="form-control" name="airflow" value="{{ product.airflow if product else '' }}"></div><div class="col-md-4"><label>Áp suất</label><input class="form-control" name="pressure" value="{{ product.pressure if product else '' }}"></div><div class="col-md-4"><label>Motor</label><input class="form-control" name="motor" value="{{ product.motor if product else '' }}"></div><div class="col-md-4"><label>Điện áp</label><input class="form-control" name="voltage" value="{{ product.voltage if product else '' }}"></div><div class="col-md-4"><label>Tốc độ</label><input class="form-control" name="speed" value="{{ product.speed if product else '' }}"></div><div class="col-12"><label>Mô tả chi tiết</label><textarea class="form-control" rows="8" name="description">{{ product.description if product else '' }}</textarea></div><div class="col-12"><div class="toggle-grid"><label class="toggle"><input type="checkbox" name="featured" {% if product and product.featured %}checked{% endif %}><span>Đánh dấu nổi bật</span></label><label class="toggle"><input type="checkbox" name="active" {% if not product or product.active %}checked{% endif %}><span>Đang hiển thị trên website</span></label></div></div><div class="col-12"><button class="btn btn-accent btn-lg rounded-pill px-4">Lưu sản phẩm</button></div></div></form></div></section>{% endblock %}
